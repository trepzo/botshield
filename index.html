<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friend Requests</title>
<style>
:root, :root[data-theme="light"] {
  --surface-0:#ffffff; --surface-100:#f7f7f8;
  --content-emphasis:#202227; --content-default:#494d5a; --content-muted:#6a6f81;
  --stroke-default:rgba(27,37,75,.12); --action-standard-bg:rgba(27,37,75,.12);
  --action-emphasis-bg:#335fff; --tab-hover-line:#bcbec8;
}
:root, :root[data-theme="dark"] {
  --surface-0:#121215; --surface-100:#272930;
  --content-emphasis:#f7f7f8; --content-default:#d5d7dd; --content-muted:#bcbec8;
  --stroke-default:rgba(208,217,251,.12); --action-standard-bg:rgba(208,217,251,.12);
  --action-emphasis-bg:#335fff; --tab-hover-line:#494d5a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Builder Sans",Helvetica,Arial,sans-serif;font-size:12px;
  background:var(--surface-0);color:var(--content-emphasis);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

.topnav{height:44px;background:var(--surface-100);border-bottom:1px solid var(--stroke-default);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.brand{font-size:18px;font-weight:800;flex-shrink:0}
.cookie-form{flex:1;display:flex;gap:6px;max-width:520px;margin-left:auto}
.input-field{flex:1;height:28px;padding:0 10px;border:1px solid var(--stroke-default);
  border-radius:6px;background:var(--surface-0);color:var(--content-emphasis);font-size:13px;outline:none}
.input-field:focus{border-color:var(--content-emphasis)}
.btn-connect{height:28px;padding:0 14px;border-radius:6px;font-size:13px;
  background:var(--action-emphasis-bg);color:#fff;font-weight:600}

.content{max-width:970px;margin:0 auto;padding:24px 16px}
.friends-title{font-size:24px;font-weight:800;padding:5px 0;margin-bottom:8px}
.status{margin-bottom:12px;font-size:13px;color:var(--content-muted)}

.requests-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0 12px; flex-wrap: wrap; margin-bottom: 12px;}
.friends-subtitle h2 { font-size: 16px; font-weight: 700; margin: 0; }
.requests-actions { display: flex; align-items: center; gap: 8px; }
.pill-btn { height: 26px; padding: 0 11px; border-radius: 8px; background: var(--action-standard-bg); color: var(--content-emphasis); font-size: 14px; font-weight: 500; white-space: nowrap; }
.pill-btn:hover:not(:disabled) { filter: brightness(1.1); }

.level-dd { position: relative; }
.level-btn {
  display: flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 8px 0 9px;
  border-radius: 8px;
  background: var(--action-standard-bg);
  color: var(--content-emphasis);
  font-size: 14px; font-weight: 500;
  white-space: nowrap;
}
.level-btn:hover { filter: brightness(1.1); }
.level-shield { width: 15px; height: 15px; color: #00b06f; }
.level-chevron { width: 14px; height: 14px; color: var(--content-muted); transition: transform .15s; }
.level-btn[aria-expanded="true"] .level-chevron { transform: rotate(180deg); }

.level-menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 50;
  width: 320px; max-width: calc(100vw - 32px);
  padding: 6px;
  border-radius: 12px;
  background: var(--surface-0);
  border: 1px solid var(--stroke-default);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .22);
}
.level-menu[hidden] { display: none; }

.level-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
}
.level-opt.active { background: var(--action-standard-bg); }
.level-opt-num {
  flex-shrink: 0; width: 24px; height: 24px; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; background: var(--action-standard-bg);
  font-size: 13px; font-weight: 700; color: var(--content-default);
}
.level-opt[aria-selected="true"] .level-opt-num { background: var(--content-emphasis); color: var(--surface-0); }
.level-opt-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.level-opt-title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--content-emphasis); }
.level-opt-desc { font-size: 12px; line-height: 1.4; color: var(--content-muted); }
.level-check {
  flex-shrink: 0; width: 16px; height: 16px; margin-top: 4px;
  fill: none; stroke: var(--content-emphasis); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  visibility: hidden;
}
.level-opt[aria-selected="true"] .level-check { visibility: visible; }
@media (max-width: 600px) { .level-menu { left: 0; right: auto; } }

.request-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;padding: 0 6px;}
.request-card { 
  display: flex; flex-direction: column; padding: 12px 12px 12px;
  background: var(--surface-100); border-radius: 8px;
}
.rc-top { display: flex; align-items: flex-start; gap: 12px; min-width: 0; color: inherit; }
.rc-avatar {
  width: 96px; height: 96px; flex-shrink: 0; border-radius: 50%;
  background: var(--action-standard-bg); object-fit: cover;
}
.rc-names { min-width: 0; padding-top: 6px; }
.rc-display, .rc-user { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-display { font-size: 16px; font-weight: 500; line-height: 1.3; color: var(--content-emphasis); }
.rc-user { font-size: 12px; line-height: 1.6; color: var(--content-default); }
.rc-top:hover .rc-display { text-decoration: underline; }

.rc-wearing { margin-top: 6px; font-size: 11px; color: var(--content-muted); }
.rc-wearing.bot { color: #e2231a; font-weight: 600; }

.rc-actions { display: flex; gap: 12px; margin-top: 24px; padding: 0 6px; }
.rc-btn { flex: 1; height: 35px; border-radius: 6px; font-size: 16px; font-weight: 500; }
.rc-btn.ignore { background: transparent; color: var(--content-muted); box-shadow: inset 0 0 0 1px var(--content-default); }
.rc-btn.ignore:hover { color: var(--content-emphasis); box-shadow: inset 0 0 0 1px var(--content-emphasis); }
.rc-btn.accept { background: var(--content-emphasis); color: var(--surface-0); }
.rc-btn.accept:hover { opacity: .88; }

@media (max-width: 900px) { .request-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .request-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="topnav">
  <div class="brand">Friends</div>
  <div class="cookie-form">
    <input class="input-field" id="cookieInput" type="password" placeholder="Paste .ROBLOSECURITY cookie">
    <button class="btn-connect" id="connectBtn">Connect</button>
  </div>
</div>

<div class="content">
  
  <div class="requests-header">
    <div class="friends-subtitle">
      <h2>Friend Requests</h2>
    </div>
    <div class="requests-actions">
      
      <div class="level-dd">
        <button class="level-btn" id="filterBtn" aria-expanded="false">
          <svg class="level-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          Filter: All
          <svg class="level-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        
        <div class="level-menu" id="filterMenu" hidden>
          <div class="level-opt" data-filter="all" aria-selected="true">
            <div class="level-opt-body"><div class="level-opt-title">All Requests</div></div>
            <svg class="level-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <div class="level-opt" data-filter="bot">
            <div class="level-opt-body"><div class="level-opt-title" style="color:#e2231a;">Likely Bots</div><div class="level-opt-desc">New accounts or wearing known bot items</div></div>
            <svg class="level-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <div class="level-opt" data-filter="real">
            <div class="level-opt-body"><div class="level-opt-title" style="color:#00a862;">Real Players</div><div class="level-opt-desc">Older accounts with normal avatars</div></div>
            <svg class="level-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="status" id="status">Not connected.</div>
  <div class="request-grid" id="grid"></div>
</div>

<script>
const PROXY = '/api/proxy';
let myCookie = '';
let allRequests = []; 
let currentFilter = 'all';

// ==========================================
// KNOWN BOT WORDS
// ==========================================
const BOT_WORDS = [
  "down to earth hair", 
  "bacon",
  "default"
]; 

async function roblox(path) {
  const res = await fetch(`${PROXY}?path=${encodeURIComponent(path)}`, {
    headers: { 'X-Roblox-Cookie': myCookie }
  });
  if (!res.ok) throw new Error('Roblox API error ' + res.status);
  return res.json();
}

// Fetch the names of the items using the Asset Delivery API
async function hasBotItem(assetIds) {
    for (const id of assetIds) {
        try {
            const res = await fetch(`https://assetdelivery.roblox.com/v1/asset?id=${id}`);
            const text = await res.text();
            const match = text.match(/<string name="Name">([^<]+)<\/string>/);
            if (match) {
                const itemName = match[1].toLowerCase();
                // Check if the name includes any of our bot words
                if (BOT_WORDS.some(word => itemName.includes(word))) {
                    return true;
                }
            }
        } catch { }
    }
    return false;
}

document.getElementById('connectBtn').onclick = async () => {
  myCookie = document.getElementById('cookieInput').value.trim();
  if (!myCookie) return alert('Paste your cookie first');
  document.getElementById('status').textContent = 'Loading...';

  try {
    const data = await roblox('friends.roblox.com/v1/my/friends/requests');
    const list = data.data || [];
    document.getElementById('status').textContent = list.length + ' pending request(s)';
    
    allRequests = [];
    for (const req of list) {
      const userId = req.sender?.userId || req.requester?.id || req.id;
      let userData = { id: userId, username: 'Unknown', displayName: 'Unknown', assetIds: [], age: 999, avatarUrl: '', isBot: false };
      
      if (userId) {
        try {
          const userInfo = await roblox(`users.roblox.com/v1/users/${userId}`);
          userData.username = userInfo.name;
          userData.displayName = userInfo.displayName;
          userData.age = Math.floor((new Date() - new Date(userInfo.created)) / (1000 * 60 * 60 * 24));
        } catch (e) {}

        try {
          const avDetails = await roblox(`avatar.roblox.com/v1/users/${userId}/avatar`);
          if (avDetails.assets) userData.assetIds = avDetails.assets;
        } catch (e) {}

        try {
          const thumbData = await roblox(`thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`);
          if (thumbData.data?.[0]?.imageUrl) userData.avatarUrl = thumbData.data[0].imageUrl;
        } catch (e) {}
      }

      // Check if they are wearing any bot items
      const isBotItemFound = await hasBotItem(userData.assetIds);
      
      userData.isBot = isBotItemFound || (userData.assetIds.length === 0) || (userData.age < 7 && userData.assetIds.length < 3);
      
      allRequests.push(userData);
    }

    renderGrid(); 
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
};

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filteredList = allRequests.filter(u => {
    if (currentFilter === 'bot') return u.isBot;
    if (currentFilter === 'real') return !u.isBot;
    return true;
  });

  if (filteredList.length === 0) {
      grid.innerHTML = `<div style="color:var(--content-muted);grid-column:1/-1;">No requests match this filter.</div>`;
      return;
  }

  for (const user of filteredList) {
    const card = document.createElement('div');
    card.className = 'request-card';
    const final
